name: mobile_controller
description: "FUAG - Universal AI Gamepad & Steering Wheel Controller"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.4
  google_mlkit_face_detection: ^0.12.0
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  google_mlkit_pose_detection: ^0.13.0
  hand_landmarker: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
